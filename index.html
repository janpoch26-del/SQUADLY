<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SQUADLY — Find your squad</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f14;
      color: #f2f2f2;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
    }

    header {
      padding: 50px 0 30px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 48px;
      letter-spacing: 4px;
    }

    header p {
      color: #9ca3af;
      margin-top: 10px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      color: #d1d5db;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .options label {
      margin: 0;
    }

    .options input {
      width: auto;
      margin-right: 5px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      margin-top: 22px;
      background: #facc15;
      color: #111827;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 15px;
      color: #9ca3af;
    }

    .match {
      border-top: 1px solid #1f2937;
      padding: 18px 0;
    }

    .match:first-child {
      border-top: none;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    .match-name {
      font-size: 18px;
      font-weight: bold;
    }

    .match-info {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.5;
    }

    .match-score {
      font-size: 18px;
      font-weight: bold;
      color: #facc15;
      white-space: nowrap;
    }

    .match-reasons {
      margin-top: 10px;
      color: #d1d5db;
      font-size: 13px;
      line-height: 1.6;
    }

    .invite-button {
      margin-top: 12px;
      background: #facc15;
      color: #111827;
      padding: 9px 14px;
    }

    .invitation,
    .squad-member {
      border-top: 1px solid #1f2937;
      padding: 16px 0;
    }

    .invitation:first-child,
    .squad-member:first-child {
      border-top: none;
    }

    .invitation span,
    .squad-member span {
      display: block;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 5px;
    }

    .invitation-buttons {
      display: flex;
      gap: 10px;
    }

    .invitation-buttons button {
      margin-top: 12px;
    }

    .accept {
      background: #22c55e;
      color: #052e16;
    }

    .reject {
      background: #374151;
      color: white;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      padding: 30px 0 50px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 38px;
      }

      .match-header {
        align-items: flex-start;
      }

      .match-score {
        font-size: 16px;
      }

      .invitation-buttons {
        flex-direction: column;
      }

      .invitation-buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>SQUADLY</h1>
    <p>Find players who actually fit your playstyle.</p>
  </header>


  <!-- PROFILE -->

  <section class="card">

    <h2>Create your profile</h2>

    <label for="game">Game</label>

    <select id="game">
      <option value="Battlefield 6">Battlefield 6</option>

    <input
      id="username"
      type="text"

    >


    <label for="platform">Platform</label>

    <select id="platform">
      <option value="PC">PC</option>
      <option value="PS4">PS4</option>

      <option value="Xbox">Xbox</option>

    <label for="playstyle">Playstyle</label>

    <select id="playstyle">
      <option value="Objective">Objective</option>

      <option value="18:00–21:00">18:00–21:00</option>
      <option value="20:00–23:00">20:00–23:00</option>
      <option value="21:00–00:00">21:00–00:00</option>
      <option value="16:00–20:00">16:00–20:00</option>
    </select>


    <label>What matters to you?</label>

    <div class="options">

      <label>
        <input
          type="checkbox"
          value="Non-toxic"
          class="trait"
        >
        Non-toxic
      </label>

      <label>
        <input
          type="checkbox"
          value="Communicates"
          class="trait"
        >
        Communicates
      </label>

      <label>
        <input
          type="checkbox"
          value="Objectives"
          class="trait"
        >
        Objectives
      </label>

      <label>
        <input
          type="checkbox"
          value="Revives"
          class="trait"
        >
        Revives
      </label>

    </div>


    <button onclick="saveProfile()">
      SAVE PROFILE & FIND MY SQUAD
    </button>

    <div id="status"></div>

  </section>


  <!-- MATCHES -->

  <section
    class="card"
    id="matchesSection"
    style="display:none;"
  >

    <h2>Compatible players</h2>

    <div id="matchesList"></div>

  </section>


  <!-- INVITATIONS -->

  <section
    class="card"
    id="invitesSection"
    style="display:none;"
  >

    <h2>Squad invitations</h2>

    <div id="invitesList"></div>

  </section>


  <!-- SQUAD -->

  <section
    class="card"
    id="squadSection"
    style="display:none;"
  >

    <h2>Your squad</h2>

    <div id="squadList"></div>

  </section>


  <footer>
    SQUADLY · Multiplayer matchmaking prototype
  </footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://jpymenfnzecdfpzgpccr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_stQYAmj7asHVVa-Qq5VdnA_Yl-R2VuC";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* -------------------------
   SECURITY
------------------------- */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* -------------------------
   FORM
------------------------- */

function getProfileFromForm() {

  const traits =
    Array.from(
      document.querySelectorAll(
        ".trait:checked"
      )
    ).map(
      input => input.value
    );


  return {

    game:
      document
        .getElementById("game")
        .value,

    username:
      document
        .getElementById("username")
        .value
        .trim(),

    platform:
      document
        .getElementById("platform")
        .value,

    playstyle:
      document
        .getElementById("playstyle")
        .value,

    mic:
      document
        .getElementById("mic")
        .value,

    region:
      document
        .getElementById("region")
        .value,

    session_time:
      document
        .getElementById("session_time")
        .value,

    traits

  };
}


/* -------------------------
   SAVE PROFILE
------------------------- */

async function saveProfile() {

  const profile =
    getProfileFromForm();

  const status =
    document.getElementById(
      "status"
    );


  if (!profile.username) {

    status.textContent =
      "Please enter a username.";

    return;
  }


  status.textContent =
    "Saving your profile...";


  /*
    Look for the username.

    maybeSingle() prevents the old
    "multiple or no rows" error when
    there is either zero or one result.
  */

  const {
    data: existingProfile,
    error: findError
  } =
    await db
      .from("profiles")
      .select("id")
      .eq(
        "username",
        profile.username
      )
      .maybeSingle();


  if (findError) {

    console.error(findError);

    status.textContent =
      "Could not check your profile: " +
      findError.message;

    return;
  }


  if (existingProfile) {

    const {
      error
    } =
      await db
        .from("profiles")
        .update(profile)
        .eq(
          "id",
          existingProfile.id
        );


    if (error) {

      console.error(error);

      status.textContent =
        "Could not update your profile: " +
        error.message;

      return;
    }

  } else {

    const {
      error
    } =
      await db
        .from("profiles")
        .insert(profile);


    if (error) {

      console.error(error);

      status.textContent =
        "Could not save your profile: " +
        error.message;

      return;
    }
  }


  status.textContent =
    "Your profile is live. Finding players...";


  await findMatches(profile);

  await loadInvites(
    profile.username
  );

  await loadSquad(
    profile.username
  );
}


/* -------------------------
   MATCHMAKING
------------------------- */

async function findMatches(myProfile) {

  const section =
    document.getElementById(
      "matchesSection"
    );

  const container =
    document.getElementById(
      "matchesList"
    );


  /*
    IMPORTANT:

    Only players from the SAME GAME
    are loaded.

    This prevents a Fortnite player
    matching with a Battlefield player.
  */

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "game",
        myProfile.game
      )
      .neq(
        "username",
        myProfile.username
      );


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p>Could not load matches.</p>";

    section.style.display =
      "block";

    return;
  }


  const matches =
    (data || []).map(
      player => {

        let score = 0;

        const reasons = [];


        /*
          GAME

          Already filtered above,
          so every result is the
          same game.
        */

        score += 10;

        reasons.push(
          "Same game"
        );


        /*
          PLATFORM
        */

        if (
          player.platform ===
          myProfile.platform
        ) {

          score += 15;

          reasons.push(
            "Same platform"
          );
        }


        /*
          PLAYSTYLE
        */

        if (
          player.playstyle ===
          myProfile.playstyle
        ) {

          score += 30;

          reasons.push(
            "Same playstyle"
          );
        }


        /*
          REGION
        */

        if (
          player.region ===
          myProfile.region
        ) {

          score += 20;

          reasons.push(
            "Same region"
          );
        }


        /*
          SESSION
        */

        if (
          player.session_time ===
          myProfile.session_time
        ) {

          score += 25;

          reasons.push(
            "Same session"
          );
        }


        /*
          VOICE CHAT
        */

        if (
          player.mic ===
          myProfile.mic
        ) {

          score += 10;

          reasons.push(
            "Same voice chat preference"
          );
        }


        /*
          TRAITS
        */

        const myTraits =
          Array.isArray(
            myProfile.traits
          )
            ? myProfile.traits
            : [];


        const theirTraits =
          Array.isArray(
            player.traits
          )
            ? player.traits
            : [];


        const sharedTraits =
          myTraits.filter(
            trait =>
              theirTraits.includes(
                trait
              )
          );


        sharedTraits.forEach(
          trait => {

            score += 5;

            reasons.push(
              "Both value " +
              trait
            );

          }
        );


        /*
          Maximum base score:

          Game       10
          Platform   15
          Playstyle  30
          Region     20
          Session    25
          Voice      10
          ----------------
          Base       110

          Traits can add extra points.
        */

        const maxScore = 130;


        const percentage =
          Math.min(
            100,
            Math.round(
              (
                score /
                maxScore
              ) * 100
            )
          );


        return {

          ...player,

          score,

          percentage,

          reasons

        };

      }
    );


  matches.sort(
    (a, b) =>
      b.score - a.score
  );


  const topMatches =
    matches.slice(0, 5);


  section.style.display =
    "block";


  container.innerHTML =
    "";


  if (
    topMatches.length === 0
  ) {

    container.innerHTML = `
      <p>
        No players found for
        ${escapeHtml(myProfile.game)}
        yet.
      </p>
    `;

    return;
  }


  topMatches.forEach(
    player => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "match";


      const reasonsText =
        player.reasons.length > 0
          ? player.reasons.join(
              " · "
            )
          : "No major profile similarities yet";


      div.innerHTML = `

        <div class="match-header">

          <div>

            <div class="match-name">
              ${escapeHtml(
                player.username
              )}
            </div>

            <div class="match-info">

              ${escapeHtml(
                player.game
              )}

              ·

              ${escapeHtml(
                player.platform
              )}

              ·

              ${escapeHtml(
                player.playstyle
              )}

              ·

              ${escapeHtml(
                player.region
              )}

              ·

              ${escapeHtml(
                player.session_time
              )}

            </div>

          </div>


          <div class="match-score">

            ${player.percentage}%

          </div>

        </div>


        <div class="match-reasons">

          <strong>
            Why you match:
          </strong>

          ${escapeHtml(
            reasonsText
          )}

        </div>


        <button
          class="invite-button"
          data-username="${escapeHtml(
            player.username
          )}"
        >
          INVITE
        </button>

      `;


      const inviteButton =
        div.querySelector(
          ".invite-button"
        );


      inviteButton.addEventListener(
        "click",
        () => {

          invitePlayer(
            player.username
          );

        }
      );


      container.appendChild(
        div
      );

    }
  );


  document.getElementById(
    "status"
  ).textContent =
    "Your profile is live. Squad matches found.";
}


/* -------------------------
   INVITE
------------------------- */

async function invitePlayer(
  username
) {

  const senderUsername =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const status =
    document.getElementById(
      "status"
    );


  if (!senderUsername) {

    status.textContent =
      "Create your profile first.";

    return;
  }


  if (
    senderUsername ===
    username
  ) {

    status.textContent =
      "You cannot invite yourself.";

    return;
  }


  status.textContent =
    "Sending invite to " +
    username +
    "...";


  const {
    data: existingInvite,
    error: checkError
  } =
    await db
      .from("invites")
      .select("id")
      .eq(
        "from",
        senderUsername
      )
      .eq(
        "to",
        username
      )
      .eq(
        "status",
        "pending"
      )
      .maybeSingle();


  if (checkError) {

    console.error(
      checkError
    );

    status.textContent =
      "Could not check invitation: " +
      checkError.message;

    return;
  }


  if (existingInvite) {

    status.textContent =
      "You already invited " +
      username +
      ".";

    return;
  }


  const {
    error
  } =
    await db
      .from("invites")
      .insert({

        from:
          senderUsername,

        to:
          username,

        status:
          "pending"

      });


  if (error) {

    console.error(error);

    status.textContent =
      "Could not send invite: " +
      error.message;

    return;
  }


  status.textContent =
    "Invite sent to " +
    username +
    "!";
}


/* -------------------------
   LOAD INVITES
------------------------- */

async function loadInvites(
  username
) {

  const section =
    document.getElementById(
      "invitesSection"
    );

  const container =
    document.getElementById(
      "invitesList"
    );


  const {
    data,
    error
  } =
    await db
      .from("invites")
      .select("*")
      .eq(
        "to",
        username
      )
      .eq(
        "status",
        "pending"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    section.style.display =
      "none";

    container.innerHTML =
      "";

    return;
  }


  section.style.display =
    "block";

  container.innerHTML =
    "";


  data.forEach(
    invite => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "invitation";


      div.innerHTML = `

        <strong>

          ${escapeHtml(
            invite.from
          )}

          wants to squad up with you.

        </strong>

        <span>
          New squad invitation
        </span>

        <div class="invitation-buttons">

          <button
            class="accept"
            data-id="${invite.id}"
            data-status="accepted"
          >
            ACCEPT
          </button>

          <button
            class="reject"
            data-id="${invite.id}"
            data-status="rejected"
          >
            REJECT
          </button>

        </div>

      `;


      div
        .querySelectorAll(
          "button"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                respondToInvite(
                  Number(
                    button.dataset.id
                  ),
                  button.dataset.status
                );

              }
            );

          }
        );


      container.appendChild(
        div
      );

    }
  );
}


/* -------------------------
   RESPOND TO INVITE
------------------------- */

async function respondToInvite(
  inviteId,
  newStatus
) {

  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  if (!username) {
    return;
  }


  const {
    data: invite,
    error: inviteError
  } =
    await db
      .from("invites")
      .select("*")
      .eq(
        "id",
        inviteId
      )
      .single();


  if (inviteError) {

    console.error(
      inviteError
    );

    document.getElementById(
      "status"
    ).textContent =
      "Could not load invitation: " +
      inviteError.message;

    return;
  }


  const {
    error: updateError
  } =
    await db
      .from("invites")
      .update({
        status:
          newStatus
      })
      .eq(
        "id",
        inviteId
      );


  if (updateError) {

    console.error(
      updateError
    );

    document.getElementById(
      "status"
    ).textContent =
      "Could not update invitation: " +
      updateError.message;

    return;
  }


  if (
    newStatus ===
    "accepted"
  ) {

    const {
      data: existingSquad,
      error: squadCheckError
    } =
      await db
        .from("squads")
        .select("*")
        .or(
          `and(player1.eq.${invite.from},player2.eq.${username}),and(player1.eq.${username},player2.eq.${invite.from})`
        )
        .maybeSingle();


    if (squadCheckError) {

      console.error(
        squadCheckError
      );

      document.getElementById(
        "status"
      ).textContent =
        "Could not check squad: " +
        squadCheckError.message;

      return;
    }


    if (!existingSquad) {

      const {
        error: squadError
      } =
        await db
          .from("squads")
          .insert({

            player1:
              invite.from,

            player2:
              username

          });


      if (squadError) {

        console.error(
          squadError
        );

        document.getElementById(
          "status"
        ).textContent =
          "Invitation accepted, but squad could not be created: " +
          squadError.message;

        return;
      }

    }

  }


  document.getElementById(
    "status"
  ).textContent =
    newStatus ===
    "accepted"
      ? "Invitation accepted! Squad created."
      : "Invitation rejected.";


  await loadInvites(
    username
  );

  await loadSquad(
    username
  );
}


/* -------------------------
   LOAD SQUAD
------------------------- */

async function loadSquad(
  username
) {

  const section =
    document.getElementById(
      "squadSection"
    );

  const container =
    document.getElementById(
      "squadList"
    );


  const {
    data,
    error
  } =
    await db
      .from("squads")
      .select("*");


  if (error) {

    console.error(error);

    return;
  }


  const mySquads =
    (data || []).filter(
      squad =>
        squad.player1 ===
          username ||
        squad.player2 ===
          username
    );


  if (
    mySquads.length ===
    0
  ) {

    section.style.display =
      "none";

    container.innerHTML =
      "";

    return;
  }


  section.style.display =
    "block";

  container.innerHTML =
    "";


  mySquads.forEach(
    squad => {

      const otherPlayer =
        squad.player1 ===
          username
          ? squad.player2
          : squad.player1;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "squad-member";


      div.innerHTML = `

        <strong>
          ${escapeHtml(
            otherPlayer
          )}
        </strong>

        <span>
          Squad member
        </span>

      `;


      container.appendChild(
        div
      );

    }
  );
}

</script>
