<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQUADLY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #ffffff;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 42px;
    }

    .subtitle {
      text-align: center;
      color: #a8adb8;
      margin-bottom: 35px;
    }

    .card {
      background: #181b22;
      border: 1px solid #2a2e38;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #c8ccd5;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #343946;
      background: #101218;
      color: white;
      font-size: 15px;
    }

    .traits {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .trait {
      background: #101218;
      border: 1px solid #343946;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }

    .trait input {
      width: auto;
      margin-right: 6px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #111111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .player {
      background: #101218;
      border: 1px solid #2c303b;
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .username {
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      font-size: 20px;
      font-weight: bold;
    }

    .meta {
      color: #a8adb8;
      font-size: 14px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .reasons {
      margin-top: 12px;
      color: #d5d8df;
      font-size: 14px;
      line-height: 1.6;
    }

    .invite-btn {
      margin-top: 14px;
    }

    .message {
      margin-top: 12px;
      color: #a8adb8;
      font-size: 14px;
    }

    .invite {
      border: 1px solid #2c303b;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      background: #101218;
    }

    .invite-actions {
      display: flex;
      gap: 10px;
    }

    .invite-actions button {
      margin-top: 12px;
    }

    .reject {
      background: #2a2e38;
      color: white;
    }

    footer {
      text-align: center;
      color: #666b75;
      font-size: 12px;
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding: 25px 0;
      }

      h1 {
        font-size: 34px;
      }

      .card {
        padding: 18px;
      }

      .traits {
        grid-template-columns: 1fr;
      }

      .player-header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SQUADLY</h1>
    <div class="subtitle">
      Find players who actually fit your playstyle.
    </div>

    <div class="card">
      <h2>Your profile</h2>

      <label for="game">Game</label>
      <select id="game">
        <option value="Battlefield 6">Battlefield 6</option>
        <option value="Fortnite">Fortnite</option>
        <option value="Valorant">Valorant</option>
        <option value="Brawl Stars">Brawl Stars</option>
      </select>

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Your username" />

      <label for="platform">Platform</label>
      <select id="platform">
        <option value="PC">PC</option>
        <option value="PS4">PS4</option>
        <option value="PS5">PS5</option>
        <option value="Xbox">Xbox</option>
      </select>

      <label for="playstyle">Playstyle</label>
      <select id="playstyle">
        <option value="Objective">Objective</option>
        <option value="Casual">Casual</option>
        <option value="Competitive">Competitive</option>
        <option value="K/D-focused">K/D-focused</option>
      </select>

      <label for="mic">Voice chat</label>
      <select id="mic">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label for="region">Region</label>
      <select id="region">
        <option value="EU">EU</option>
        <option value="NA">NA</option>
      </select>

      <label for="session_time">Typical session</label>
      <select id="session_time">
        <option value="18:00–21:00">18:00–21:00</option>
        <option value="20:00–23:00">20:00–23:00</option>
        <option value="21:00–00:00">21:00–00:00</option>
        <option value="16:00–20:00">16:00–20:00</option>
      </select>

      <label>Traits</label>

      <div class="traits">
        <label class="trait">
          <input type="checkbox" value="Non-toxic" />
          Non-toxic
        </label>

        <label class="trait">
          <input type="checkbox" value="Communicates" />
          Communicates
        </label>

        <label class="trait">
          <input type="checkbox" value="Objectives" />
          Objectives
        </label>

        <label class="trait">
          <input type="checkbox" value="Revives" />
          Revives
        </label>
      </div>

      <button id="saveProfile">Save profile</button>

      <div id="profileMessage" class="message"></div>
    </div>

    <div class="card">
      <h2>Matches</h2>
      <div id="matches"></div>
    </div>

    <div class="card">
      <h2>Invitations</h2>
      <div id="invites"></div>
    </div>

    <div class="card">
      <h2>Your Squad</h2>
      <div id="squad"></div>
    </div>

    <footer>
      SQUADLY · Multiplayer matchmaking prototype
    </footer>

  </div>

  <script>
    const SUPABASE_URL =
      "https://jpymenfnzecdfpzgpccr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_stQYAmj7asHVVa-Qq5VdnA_Yl-R2VuC";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let myProfile = null;

    function getProfile() {
      const traits = Array.from(
        document.querySelectorAll('.trait input:checked')
      ).map(input => input.value);

      return {
        game: document.getElementById("game").value,
        username: document.getElementById("username").value.trim(),
        platform: document.getElementById("platform").value,
        playstyle: document.getElementById("playstyle").value,
        mic: document.getElementById("mic").value,
        region: document.getElementById("region").value,
        session_time: document.getElementById("session_time").value,
        traits
      };
    }

    async function saveProfile() {
      const profile = getProfile();

      if (!profile.username) {
        document.getElementById("profileMessage").textContent =
          "Please enter a username.";
        return;
      }

      const { data: existing, error: findError } = await db
        .from("profiles")
        .select("*")
        .eq("username", profile.username)
        .maybeSingle();

      if (findError) {
        console.error(findError);
        document.getElementById("profileMessage").textContent =
          "Error loading profile.";
        return;
      }

      let error;

      if (existing) {
        const result = await db
          .from("profiles")
          .update(profile)
          .eq("id", existing.id);

        error = result.error;
      } else {
        const result = await db
          .from("profiles")
          .insert([profile]);

        error = result.error;
      }

      if (error) {
        console.error(error);
        document.getElementById("profileMessage").textContent =
          "Error saving profile.";
        return;
      }

      myProfile = profile;

      document.getElementById("profileMessage").textContent =
        "Profile saved.";

      await loadMatches();
      await loadInvites();
      await loadSquad(profile.username);
    }

    function calculateMatch(player) {
      let score = 0;
      const reasons = [];

      // 30 points
      if (player.playstyle === myProfile.playstyle) {
        score += 30;
        reasons.push("Same playstyle");
      }

      // 25 points
      if (player.session_time === myProfile.session_time) {
        score += 25;
        reasons.push("Same session");
      }

      // 20 points
      if (player.region === myProfile.region) {
        score += 20;
        reasons.push("Same region");
      }

      // 15 points
      if (player.platform === myProfile.platform) {
        score += 15;
        reasons.push("Same platform");
      }

      // 10 points
      if (player.mic === myProfile.mic) {
        score += 10;
        reasons.push("Same voice chat preference");
      }

      const sharedTraits = (player.traits || []).filter(trait =>
        (myProfile.traits || []).includes(trait)
      );

      sharedTraits.forEach(trait => {
        reasons.push(`Both value ${trait}`);
      });

      return {
        score,
        reasons
      };
    }

    async function loadMatches() {
      const container = document.getElementById("matches");

      if (!myProfile) {
        container.innerHTML =
          '<div class="message">Save your profile first.</div>';
        return;
      }

      const { data, error } = await db
        .from("profiles")
        .select("*")
        .eq("game", myProfile.game)
        .neq("username", myProfile.username);

      if (error) {
        console.error(error);
        container.innerHTML =
          '<div class="message">Error loading matches.</div>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML =
          '<div class="message">No players found for this game yet.</div>';
        return;
      }

      const matches = data
        .map(player => {
          const result = calculateMatch(player);

          return {
            ...player,
            ...result
          };
        })
        .sort((a, b) => b.score - a.score);

      container.innerHTML = "";

      matches.forEach(player => {
        const div = document.createElement("div");
        div.className = "player";

        div.innerHTML = `
          <div class="player-header">
            <div class="username">${player.username}</div>
            <div class="score">${player.score}%</div>
          </div>

          <div class="meta">
            ${player.game} · ${player.platform} · ${player.playstyle}
          </div>

          <div class="reasons">
            <strong>Why you match:</strong>
            ${player.reasons.length
              ? player.reasons.join(" · ")
              : "No matching preferences yet."}
          </div>

          <button class="invite-btn" data-username="${player.username}">
            Invite to squad
          </button>
        `;

        const button = div.querySelector(".invite-btn");

        button.addEventListener("click", () => {
          sendInvite(player.username);
        });

        container.appendChild(div);
      });
    }

    async function sendInvite(username) {
      if (!myProfile) return;

      if (username === myProfile.username) {
        return;
      }

      const { data: existing, error: checkError } = await db
        .from("invites")
        .select("*")
        .eq("from", myProfile.username)
        .eq("to", username)
        .eq("status", "pending")
        .maybeSingle();

      if (checkError) {
        console.error(checkError);
        return;
      }

      if (existing) {
        alert("Invitation already sent.");
        return;
      }

      const { error } = await db
        .from("invites")
        .insert([{
          from: myProfile.username,
          to: username,
          status: "pending"
        }]);

      if (error) {
        console.error(error);
        alert("Error sending invitation.");
        return;
      }

      alert("Invitation sent.");
    }

    async function loadInvites() {
      const container = document.getElementById("invites");

      if (!myProfile) {
        container.innerHTML =
          '<div class="message">Save your profile first.</div>';
        return;
      }

      const { data, error } = await db
        .from("invites")
        .select("*")
        .eq("to", myProfile.username)
        .eq("status", "pending")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        container.innerHTML =
          '<div class="message">Error loading invitations.</div>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML =
          '<div class="message">No pending invitations.</div>';
        return;
      }

      container.innerHTML = "";

      data.forEach(invite => {
        const div = document.createElement("div");
        div.className = "invite";

        div.innerHTML = `
          <strong>${invite.from}</strong> wants to squad up with you.

          <div class="invite-actions">
            <button class="accept">Accept</button>
            <button class="reject">Reject</button>
          </div>
        `;

        div.querySelector(".accept").addEventListener("click", () => {
          respondToInvite(invite.id, "accepted");
        });

        div.querySelector(".reject").addEventListener("click", () => {
          respondToInvite(invite.id, "rejected");
        });

        container.appendChild(div);
      });
    }

    async function respondToInvite(id, status) {
      const { data: invite, error: inviteError } = await db
        .from("invites")
        .select("*")
        .eq("id", id)
        .maybeSingle();

      if (inviteError || !invite) {
        console.error(inviteError);
        return;
      }

      const { error: updateError } = await db
        .from("invites")
        .update({ status })
        .eq("id", id);

      if (updateError) {
        console.error(updateError);
        return;
      }

      if (status === "accepted") {
        const { data: existingSquads, error: squadError } = await db
          .from("squads")
          .select("*")
          .or(
            `and(player1.eq.${invite.from},player2.eq.${invite.to}),and(player1.eq.${invite.to},player2.eq.${invite.from})`
          );

        if (squadError) {
          console.error(squadError);
        } else if (!existingSquads || existingSquads.length === 0) {
          const { error } = await db
            .from("squads")
            .insert([{
              player1: invite.from,
              player2: invite.to
            }]);

          if (error) {
            console.error(error);
          }
        }
      }

      await loadInvites();
      await loadSquad(myProfile.username);
    }

    async function loadSquad(username) {
      const container = document.getElementById("squad");

      if (!username) {
        container.innerHTML =
          '<div class="message">Save your profile first.</div>';
        return;
      }

      const { data, error } = await db
        .from("squads")
        .select("*");

      if (error) {
        console.error(error);
        container.innerHTML =
          '<div class="message">Error loading squad.</div>';
        return;
      }

      const squad = (data || []).filter(item =>
        item.player1 === username ||
        item.player2 === username
      );

      if (squad.length === 0) {
        container.innerHTML =
          '<div class="message">You are not in a squad yet.</div>';
        return;
      }

      container.innerHTML = "";

      squad.forEach(item => {
        const member =
          item.player1 === username
            ? item.player2
            : item.player1;

        const div = document.createElement("div");
        div.className = "player";

        div.innerHTML = `
          <div class="username">${member}</div>
          <div class="meta">Squad member</div>
        `;

        container.appendChild(div);
      });
    }

    document
      .getElementById("saveProfile")
      .addEventListener("click", saveProfile);
  </script>

</body>
</html>
