<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQUADLY — Find your squad</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
    }

    .container {
      width: min(1050px, 92%);
      margin: auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .beta {
      color: #999;
      font-size: 11px;
      margin-left: 10px;
      border: 1px solid #333;
      padding: 5px 8px;
      border-radius: 5px;
    }

    .hero {
      padding: 70px 0 45px;
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      margin: 0;
      line-height: .95;
      letter-spacing: -4px;
    }

    .subtitle {
      color: #999;
      font-size: 18px;
      margin-top: 22px;
    }

    .card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      background: #080808;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
      font-size: 14px;
    }

    .traits {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .trait {
      background: #0a0a0a;
      border: 1px solid #292929;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .trait input {
      width: auto;
      margin-right: 8px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: white;
      color: black;
      border: 0;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }

    .status {
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
      text-align: center;
    }

    .matches {
      display: grid;
      gap: 12px;
    }

    .player {
      border: 1px solid #292929;
      background: #0b0b0b;
      border-radius: 10px;
      padding: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .player-info strong {
      display: block;
      font-size: 17px;
      margin-bottom: 6px;
    }

    .player-info span {
      color: #888;
      font-size: 12px;
    }

    .invite {
      width: auto;
      margin: 0;
      padding: 10px 15px;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      padding: 35px 0;
    }

    @media (max-width: 700px) {
      .grid,
      .traits {
        grid-template-columns: 1fr;
      }

      .player {
        align-items: flex-start;
        flex-direction: column;
      }

      .invite {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <span class="logo">SQUADLY</span>
    <span class="beta">BETA · BF6</span>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Find your squad.<br>Keep your squad.</h1>
    <div class="subtitle">
      Find Battlefield 6 players who actually fit your playstyle.
    </div>
  </section>

  <section class="card">

    <h2>Create your profile</h2>

    <div class="grid">

      <div>
        <label>Username</label>
        <input id="username" type="text" placeholder="Your gamer tag">
      </div>

      <div>
        <label>Platform</label>
        <select id="platform">
          <option value="PC">PC</option>
          <option value="PS5">PS5</option>
          <option value="Xbox">Xbox</option>
        </select>
      </div>

      <div>
        <label>Playstyle</label>
        <select id="playstyle">
          <option value="Objective">Objective</option>
          <option value="Casual">Casual</option>
          <option value="Competitive">Competitive</option>
          <option value="K/D-focused">K/D-focused</option>
        </select>
      </div>

      <div>
        <label>Voice chat</label>
        <select id="mic">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <div>
        <label>Region</label>
        <select id="region">
          <option value="EU">EU</option>
          <option value="NA">NA</option>
        </select>
      </div>

      <div>
        <label>Typical session</label>
        <select id="session_time">
          <option value="18:00–21:00">18:00–21:00</option>
          <option value="20:00–23:00">20:00–23:00</option>
          <option value="21:00–00:00">21:00–00:00</option>
          <option value="16:00–20:00">16:00–20:00</option>
        </select>
      </div>

    </div>

    <h2 style="margin-top:25px;">What matters to you?</h2>

    <div class="traits">

      <label class="trait">
        <input type="checkbox" value="Non-toxic">
        Non-toxic
      </label>

      <label class="trait">
        <input type="checkbox" value="Communicates">
        Communicates
      </label>

      <label class="trait">
        <input type="checkbox" value="Objectives">
        Objectives
      </label>

      <label class="trait">
        <input type="checkbox" value="Revives">
        Revives
      </label>

    </div>

    <button onclick="saveProfile()">
      SAVE PROFILE & FIND MY SQUAD
    </button>

    <div id="status" class="status"></div>

  </section>

  <section class="card" id="resultsSection" style="display:none;">

    <h2>Compatible players</h2>

    <div id="matches" class="matches"></div>

  </section>

</main>

<footer>
  SQUADLY · Battlefield 6 matchmaking prototype
</footer>

<script>

  const SUPABASE_URL =
    "https://jpymenfnzecdfpzgpccr.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_stQYAmj7asHVVa-Qq5VdnA_Yl-R2VuC";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  async function saveProfile() {

    const username =
      document.getElementById("username").value.trim();

    if (!username) {
      document.getElementById("status").textContent =
        "Enter your username first.";
      return;
    }

    const traits = Array.from(
      document.querySelectorAll(".trait input:checked")
    ).map(input => input.value);

    const profile = {
      username: username,
      platform: document.getElementById("platform").value,
      playstyle: document.getElementById("playstyle").value,
      mic: document.getElementById("mic").value === "true",
      region: document.getElementById("region").value,
      session_time: document.getElementById("session_time").value,
      traits: traits.join(",")
    };

    document.getElementById("status").textContent =
      "Saving your profile...";

    const { error } = await db
      .from("profiles")
      .insert(profile);

    if (error) {
      console.error(error);

      document.getElementById("status").textContent =
        "Error saving profile: " + error.message;

      return;
    }

    document.getElementById("status").textContent =
      "Profile saved. Finding your squad...";

    await findMatches(profile);
  }


  async function findMatches(myProfile) {

    const { data, error } = await db
      .from("profiles")
      .select("*")
      .limit(100);

    if (error) {
      console.error(error);

      document.getElementById("status").textContent =
        "Could not load players.";

      return;
    }

    const otherPlayers = data.filter(
      player => player.username !== myProfile.username
    );

    const scoredPlayers = otherPlayers.map(player => {

      let score = 0;

      if (player.platform === myProfile.platform) {
        score += 20;
      }

      if (player.playstyle === myProfile.playstyle) {
        score += 30;
      }

      if (player.region === myProfile.region) {
        score += 25;
      }

      if (player.session_time === myProfile.session_time) {
        score += 25;
      }

      if (player.mic === myProfile.mic) {
        score += 10;
      }

      const myTraits =
        myProfile.traits
          .split(",")
          .filter(Boolean);

      const theirTraits =
        (player.traits || "")
          .split(",")
          .filter(Boolean);

      myTraits.forEach(trait => {
        if (theirTraits.includes(trait)) {
          score += 5;
        }
      });

      return {
        ...player,
        score
      };

    });

    scoredPlayers.sort(
      (a, b) => b.score - a.score
    );

    displayMatches(
      scoredPlayers.slice(0, 5)
    );
  }


  function displayMatches(players) {

    const section =
      document.getElementById("resultsSection");

    const container =
      document.getElementById("matches");

    section.style.display = "block";

    container.innerHTML = "";

    if (players.length === 0) {

      container.innerHTML = `
        <div class="status">
          No players found yet. Share SQUADLY with other BF6 players.
        </div>
      `;

      document.getElementById("status").textContent =
        "Profile saved.";

      return;
    }

    players.forEach(player => {

      const div =
        document.createElement("div");

      div.className = "player";

      div.innerHTML = `
        <div class="player-info">
          <strong>${escapeHtml(player.username)}</strong>
          <span>
            ${escapeHtml(player.platform)}
            · ${escapeHtml(player.playstyle)}
            · ${escapeHtml(player.region)}
            · ${escapeHtml(player.session_time)}
            · Match ${player.score}%
          </span>
        </div>

        <button
          class="invite"
          onclick="invitePlayer('${escapeHtml(player.username)}')">
          INVITE
        </button>
      `;

      container.appendChild(div);
    });

    document.getElementById("status").textContent =
      "Your profile is live. Squad matches found.";
  }


 function invitePlayer(username) {
  const status = document.getElementById("status");

  status.textContent = "Sending invite to " + username + "...";

  setTimeout(() => {
    status.textContent = "Invite sent to " + username + "!";
  }, 800);
}


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

</script>

</body>
</html>
