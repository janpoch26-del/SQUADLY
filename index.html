<body>

<header>
  <div class="container">
    <span class="logo">SQUADLY</span>
    <span class="beta">BETA · BF6</span>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Find your squad.<br>Keep your squad.</h1>

    <div class="subtitle">
      Find Battlefield 6 players who actually fit your playstyle.
    </div>
  </section>

  <section class="card">

    <h2>Create your profile</h2>

    <div class="grid">

      <div>
        <label>Username</label>
        <input id="username" type="text" placeholder="Your gamer tag">
      </div>

      <div>
        <label>Platform</label>
        <select id="platform">
          <option value="PC">PC</option>
          <option value="PS5">PS5</option>
          <option value="Xbox">Xbox</option>
        </select>
      </div>

      <div>
        <label>Playstyle</label>
        <select id="playstyle">
          <option value="Objective">Objective</option>
          <option value="Casual">Casual</option>
          <option value="Competitive">Competitive</option>
          <option value="K/D-focused">K/D-focused</option>
        </select>
      </div>

      <div>
        <label>Voice chat</label>
        <select id="mic">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <div>
        <label>Region</label>
        <select id="region">
          <option value="EU">EU</option>
          <option value="NA">NA</option>
        </select>
      </div>

      <div>
        <label>Typical session</label>
        <select id="session_time">
          <option value="18:00–21:00">18:00–21:00</option>
          <option value="20:00–23:00">20:00–23:00</option>
          <option value="21:00–00:00">21:00–00:00</option>
          <option value="16:00–20:00">16:00–20:00</option>
        </select>
      </div>

    </div>

    <h2 style="margin-top:25px;">What matters to you?</h2>

    <div class="traits">

      <label class="trait">
        <input type="checkbox" value="Non-toxic">
        Non-toxic
      </label>

      <label class="trait">
        <input type="checkbox" value="Communicates">
        Communicates
      </label>

      <label class="trait">
        <input type="checkbox" value="Objectives">
        Objectives
      </label>

      <label class="trait">
        <input type="checkbox" value="Revives">
        Revives
      </label>

    </div>

    <button onclick="saveProfile()">
      SAVE PROFILE & FIND MY SQUAD
    </button>

    <div id="status" class="status"></div>

  </section>

  <section class="card" id="resultsSection" style="display:none;">

    <h2>Compatible players</h2>

    <div id="matches" class="matches"></div>

  </section>

  <section class="card" id="invitesSection" style="display:none;">

    <h2>Squad invitations</h2>

    <div id="invitesList"></div>

  <section class="card" id="squadSection" style="display:none;">

    <div id="squadList"></div>

  </section>

</main>

<footer>
  SQUADLY · Battlefield 6 matchmaking prototype
</footer>


<script>

const SUPABASE_URL =
  "https://jpymenfnzecdfpzgpccr.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_stQYAmj7asHVVa-Qq5VdnA_Yl-R2VuC";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function saveProfile() {

  const username =
    document.getElementById("username").value.trim();

  const status =
    document.getElementById("status");

  if (!username) {
    status.textContent =
      "Enter your username first.";
    return;
  }

  const traits =
    Array.from(
      document.querySelectorAll(".trait input:checked")
    ).map(input => input.value);

  const profile = {
    username: username,
    platform: document.getElementById("platform").value,
    playstyle: document.getElementById("playstyle").value,
    mic: document.getElementById("mic").value === "true",
    region: document.getElementById("region").value,
    session_time: document.getElementById("session_time").value,
    traits: traits.join(",")
  };

  status.textContent =
    "Saving your profile...";

  const { error } =
    await db
      .from("profiles")
      .insert(profile);

  if (error) {

    console.error(error);

    status.textContent =
      "Error saving profile: " + error.message;

    return;
  }

  status.textContent =
    "Profile saved. Finding your squad...";

  await findMatches(profile);
  await loadInvites(username);
  await loadSquad(username);
}


async function findMatches(myProfile) {

  const { data, error } =
    await db
      .from("profiles")
      .select("*")
      .limit(100);

  if (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Could not load players.";

    return;
  }

  const otherPlayers =
    data.filter(
      player =>
        player.username !== myProfile.username
    );

  const scoredPlayers =
    otherPlayers.map(player => {

      let score = 0;

      if (player.platform === myProfile.platform) {
        score += 20;
      }

      if (player.playstyle === myProfile.playstyle) {
        score += 30;
      }

      if (player.region === myProfile.region) {
        score += 25;
      }

      if (player.session_time === myProfile.session_time) {
        score += 25;
      }

      if (player.mic === myProfile.mic) {
        score += 10;
      }

      const myTraits =
        myProfile.traits
          .split(",")
          .filter(Boolean);

      const theirTraits =
        (player.traits || "")
          .split(",")
          .filter(Boolean);

      myTraits.forEach(trait => {

        if (theirTraits.includes(trait)) {
          score += 5;
        }

      });

      const maxScore = 110;

      const normalizedScore =
        Math.round((score / maxScore) * 100);

      return {
        ...player,
        score: normalizedScore
      };

    });

  scoredPlayers.sort(
    (a, b) => b.score - a.score
  );

  displayMatches(
    scoredPlayers.slice(0, 5)
  );
}


function displayMatches(players) {

  const section =
    document.getElementById("resultsSection");

  const container =
    document.getElementById("matches");

  section.style.display = "block";

  container.innerHTML = "";

  if (players.length === 0) {

    container.innerHTML = `
      <div class="status">
        No players found yet. Share SQUADLY with other BF6 players.
      </div>
    `;

    document.getElementById("status").textContent =
      "Profile saved.";

    return;
  }

  players.forEach(player => {

    const div =
      document.createElement("div");

    div.className = "player";

    div.innerHTML = `
      <div class="player-info">

        <strong>
          ${escapeHtml(player.username)}
        </strong>

        <span>
          ${escapeHtml(player.platform)}
          · ${escapeHtml(player.playstyle)}
          · ${escapeHtml(player.region)}
          · ${escapeHtml(player.session_time)}
          · Match ${player.score}%
        </span>

      </div>

      <button
        class="invite"
        data-username="${escapeHtml(player.username)}">
        INVITE
      </button>
    `;

    const inviteButton =
      div.querySelector(".invite");

    inviteButton.addEventListener(
      "click",
      function () {
        invitePlayer(player.username);
      }
    );

    container.appendChild(div);

  });

  document.getElementById("status").textContent =
    "Your profile is live. Squad matches found.";
}


async function invitePlayer(username) {

  const senderUsername =
    document.getElementById("username").value.trim();

  const status =
    document.getElementById("status");

  if (!senderUsername) {

    status.textContent =
      "Create your profile first.";

    return;
  }

  status.textContent =
    "Sending invite to " + username + "...";

  const { error } =
    await db
      .from("invites")
      .insert({
        from: senderUsername,
        to: username,
        status: "pending"
      });

  if (error) {

    console.error(error);

    status.textContent =
      "Could not send invite: " + error.message;

    return;
  }

  status.textContent =
    "Invite sent to " + username + "!";
}


async function loadInvites(username) {

  const section =
    document.getElementById("invitesSection");

  const container =
    document.getElementById("invitesList");

  const { data, error } =
    await db
      .from("invites")
      .select("*")
      .eq("to", username)
      .eq("status", "pending")
      .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    return;
  }

  if (!data || data.length === 0) {

    section.style.display = "none";

    return;
  }

  section.style.display = "block";

  container.innerHTML = "";

  data.forEach(invite => {

    const div =
      document.createElement("div");

    div.className = "invitation";

    div.innerHTML = `
      <strong>
        ${escapeHtml(invite.from)} wants to squad up with you.
      </strong>

      <span>
        New squad invitation
      </span>

      <div class="invitation-buttons">

        <button
          class="accept"
          onclick="respondToInvite(${invite.id}, 'accepted')">
          ACCEPT
        </button>

        <button
          class="reject"
          onclick="respondToInvite(${invite.id}, 'rejected')">
          REJECT
        </button>

      </div>
    `;

    container.appendChild(div);

  });
}


async function respondToInvite(inviteId, newStatus) {

  const username =
    document.getElementById("username").value.trim();

  const { data: invite, error: inviteError } =
    await db
      .from("invites")
      .select("*")
      .eq("id", inviteId)
      .single();

  if (inviteError) {

    console.error(inviteError);

    document.getElementById("status").textContent =
      "Could not load invitation: " + inviteError.message;

    return;
  }

  const { error: updateError } =
    await db
      .from("invites")
      .update({
        status: newStatus
      })
      .eq("id", inviteId);

  if (updateError) {

    console.error(updateError);

    document.getElementById("status").textContent =
      "Could not update invitation: " + updateError.message;

    return;
  }

  if (newStatus === "accepted") {

    const { error: squadError } =
      await db
        .from("squads")
        .insert({
          player1: invite.from,
          player2: username
        });

    if (squadError) {

      console.error(squadError);

      document.getElementById("status").textContent =
        "Invitation accepted, but squad could not be created: " +
        squadError.message;

      return;
    }
  }

  document.getElementById("status").textContent =
    newStatus === "accepted"
      ? "Invitation accepted! Squad created."
      : "Invitation rejected.";

  await loadInvites(username);
  await loadSquad(username);
}


async function loadSquad(username) {

  const section =
    document.getElementById("squadSection");

  const container =
    document.getElementById("squadList");

  const { data, error } =
    await db
      .from("squads")
      .select("*");

  if (error) {

    console.error(error);

    return;
  }

  const mySquads =
    (data || []).filter(
      squad =>
        squad.player1 === username ||
        squad.player2 === username
    );

  if (mySquads.length === 0) {

    section.style.display = "none";

    return;
  }

  section.style.display = "block";

  container.innerHTML = "";

  mySquads.forEach(squad => {

    const otherPlayer =
      squad.player1 === username
        ? squad.player2
        : squad.player1;

    const div =
      document.createElement("div");

    div.className = "squad-member";

    div.innerHTML = `
      <strong>
        ${escapeHtml(otherPlayer)}
      </strong>

      <span>
        Squad member
      </span>
    `;

    container.appendChild(div);

  });
}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
